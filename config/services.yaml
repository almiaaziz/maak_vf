services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\Service\UserTokenService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'